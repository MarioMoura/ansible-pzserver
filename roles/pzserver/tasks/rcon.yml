# Warn connected players and save the world; skipped when the server is down
- name: Check server state
  ansible.builtin.systemd:
    name: "{{ pzserver_service_name }}"
  register: pzserver_unit

- name: Warn players and save world
  when: pzserver_unit.status.ActiveState | default('inactive') == 'active'
  block:
    - name: Send RCON warning
      become_user: "{{ pzserver_user }}"
      ansible.builtin.command:
        argv:
          - "{{ pzserver_home }}/pzrcon.py"
          - --timeout
          - "{{ pzserver_rcon_timeout }}"
          - 127.0.0.1
          - "{{ pzserver_cfg.rcon.port }}"
          - "{{ pzserver_cfg.rcon.password }}"
          - servermsg "Server restarting in {{ pzserver_restart_warning }} seconds for maintenance"
          - save
      register: pzserver_rcon
      changed_when: false
      failed_when: false
      no_log: true

    - name: Report RCON failure
      ansible.builtin.debug:
        msg: "RCON warning failed (rc={{ pzserver_rcon.rc }}): {{ pzserver_rcon.stderr | regex_replace(pzserver_cfg.rcon.password, '***') }}"
      when: pzserver_rcon.rc != 0

    - name: Wait for players
      ansible.builtin.pause:
        seconds: "{{ pzserver_restart_warning }}"
